[package]
name = "specd"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "specd"
path = "src/main.rs"

[dependencies]
tray-icon = "0.19"
winit = "0.30"
interprocess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.52"
protocol = { path = "../protocol" }
winrt-notification = "0.5"
tiny-skia = "0.11"

[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Security",
]
